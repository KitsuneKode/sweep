[workspace]
members = [
    "crates/sweep-types",
    "crates/sweep-errors",
    "crates/sweep-fs",
    "crates/sweep-engine",
    "crates/sweep-engine-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
camino = "1"
tempfile = "3"
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
rayon = "1"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Identity for Turborepo's experimental Cargo workspace support: this
# synthetic workspace package is `sweep-rust`, so `turbo run "sweep-rust#test"`
# runs `cargo test --workspace`. Member crates are their own packages.
[workspace.metadata]
name = "sweep-rust"

[profile.release]
lto = true
codegen-units = 1
strip = true
