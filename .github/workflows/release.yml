name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_native:
        description: Build native engine matrix before publish
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; the release job escalates for itself below.
permissions:
  contents: read

jobs:
  release-intent:
    name: detect release intent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_native_build: ${{ steps.intent.outputs.needs_native_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_NATIVE_INPUT: ${{ inputs.build_native }}
        run: |
          needs_native="false"
          # In prerelease mode applied changeset files remain in the repo.
          pending="$(node -e '
            const fs = require("fs");
            const pre = fs.existsSync(".changeset/pre.json") ? JSON.parse(fs.readFileSync(".changeset/pre.json", "utf8")) : null;
            const applied = new Set(pre?.mode === "pre" ? pre.changesets : []);
            console.log(fs.readdirSync(".changeset").some(f => f.endsWith(".md") && f !== "README.md" && !applied.has(f.slice(0, -3))) ? "true" : "false");
          ')"
          version="$(node -p "require('./apps/cli/package.json').version")"
          tag="@kitsunekode/sweep@$version"
          # Release intent follows version/tag state, not the merge commit title.
          if [ "$pending" = "false" ] && ! git show-ref --verify --quiet "refs/tags/$tag"; then
            needs_native="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$BUILD_NATIVE_INPUT" = "true" ]; then
            needs_native="true"
          fi
          echo "needs_native_build=$needs_native" >> "$GITHUB_OUTPUT"
          echo "native engine build required: $needs_native"

  build-engine:
    name: build native engines
    needs: release-intent
    if: needs.release-intent.outputs.needs_native_build == 'true'
    uses: ./.github/workflows/native-engine-release.yml

  release:
    name: version or publish
    needs: [release-intent, build-engine]
    if: |
      always() &&
      needs.release-intent.result == 'success' &&
      (needs.release-intent.outputs.needs_native_build != 'true' || needs.build-engine.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.release-intent.outputs.needs_native_build == 'true'
        with:
          name: native-packages-all
          path: native-packages

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Trusted publishing (OIDC) needs setup-node v6: v4/v5 write an
      # `_authToken=` line into .npmrc, and npm reads that as "auth is already
      # configured" and never starts the OIDC exchange - which is what failed
      # the 0.3.0 release with ENEEDAUTH. Node 24 carries npm 11.x; OIDC needs
      # npm >= 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fail loudly here rather than half way through a publish.
      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          have="$(npm --version)"
          need="11.5.1"
          echo "npm $have (trusted publishing needs >= $need)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is older than $need; trusted publishing would fall back to token auth"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # publish-release.ts runs the turbo preflight, which builds the Rust
      # engine - provision the toolchain rather than trust the runner image.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Detect whether changesets should run
        id: changesets
        shell: bash
        run: |
          run_changesets="false"

          for file in .changeset/*.md; do
            [ -e "$file" ] || continue
            if [ "$(basename "$file")" != "README.md" ]; then
              run_changesets="true"
              break
            fi
          done

          if [ "${{ needs.release-intent.outputs.needs_native_build }}" = "true" ]; then
            run_changesets="true"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_changesets="true"
          fi

          echo "run=$run_changesets" >> "$GITHUB_OUTPUT"
          echo "changesets action required: $run_changesets"

      - name: No release work needed
        if: steps.changesets.outputs.run != 'true'
        run: echo "No pending changesets or version publish; skipping changesets action."

      - name: Create release PR or publish
        id: release
        if: steps.changesets.outputs.run == 'true'
        # Action v1 supports our CLI v2; action v2 requires CLI v3.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version
          publish: bun run scripts/publish-release.ts
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_RELEASE_REQUIRES_NATIVE: "true"

      # Changesets uses package@version. Keep the public binary/download tag
      # as vVERSION and dispatch explicitly: GITHUB_TOKEN pushes do not trigger
      # another workflow. Refuse to move an existing version tag.
      - name: Build standalone binaries for the tag
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          package_tag="@kitsunekode/sweep@$version"
          binary_tag="v$version"
          commit="$(git rev-parse "$package_tag^{commit}")"
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "Package release tag does not match the checked-out release"; exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$binary_tag"; then
            [ "$(git rev-parse "$binary_tag^{commit}")" = "$commit" ] || exit 1
          else
            git tag "$binary_tag" "$commit"
          fi
          git push origin "refs/tags/$binary_tag"
          gh workflow run cli-binaries.yml --ref "$binary_tag"
