name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_native:
        description: Build native engine matrix before publish
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-intent:
    name: detect release intent
    runs-on: ubuntu-latest
    outputs:
      needs_native_build: ${{ steps.intent.outputs.needs_native_build }}
    steps:
      - id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_NATIVE_INPUT: ${{ inputs.build_native }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          needs_native="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BUILD_NATIVE_INPUT" = "true" ]; then
              needs_native="true"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -qiE '^chore: version packages'; then
              needs_native="true"
            fi
          fi

          echo "needs_native_build=$needs_native" >> "$GITHUB_OUTPUT"
          echo "native engine build required: $needs_native"

  build-engine:
    name: build native engines
    needs: release-intent
    if: needs.release-intent.outputs.needs_native_build == 'true'
    uses: ./.github/workflows/native-engine-release.yml

  release:
    name: version or publish
    needs: [release-intent, build-engine]
    if: |
      always() &&
      needs.release-intent.result == 'success' &&
      (needs.release-intent.outputs.needs_native_build != 'true' || needs.build-engine.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.release-intent.outputs.needs_native_build == 'true'
        with:
          name: native-packages-all
          path: native-packages

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Trusted publishing (OIDC) needs setup-node v6: v4/v5 write an
      # `_authToken=` line into .npmrc, and npm reads that as "auth is already
      # configured" and never starts the OIDC exchange - which is what failed
      # the 0.3.0 release with ENEEDAUTH. Node 24 carries npm 11.x; OIDC needs
      # npm >= 11.5.1.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fail loudly here rather than half way through a publish.
      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          have="$(npm --version)"
          need="11.5.1"
          echo "npm $have (trusted publishing needs >= $need)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is older than $need; trusted publishing would fall back to token auth"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Detect whether changesets should run
        id: changesets
        shell: bash
        run: |
          run_changesets="false"

          for file in .changeset/*.md; do
            [ -e "$file" ] || continue
            if [ "$(basename "$file")" != "README.md" ]; then
              run_changesets="true"
              break
            fi
          done

          if [ "${{ needs.release-intent.outputs.needs_native_build }}" = "true" ]; then
            run_changesets="true"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_changesets="true"
          fi

          echo "run=$run_changesets" >> "$GITHUB_OUTPUT"
          echo "changesets action required: $run_changesets"

      - name: No release work needed
        if: steps.changesets.outputs.run != 'true'
        run: echo "No pending changesets or version publish; skipping changesets action."

      - name: Create release PR or publish
        id: release
        if: steps.changesets.outputs.run == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: bun run version
          publish: bun run scripts/publish-release.ts
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_RELEASE_REQUIRES_NATIVE: ${{ needs.release-intent.outputs.needs_native_build }}

      # The v* tag pushed by changesets/action above is a GITHUB_TOKEN event,
      # which GitHub suppresses - cli-binaries.yml's `push: tags` trigger never
      # fires. Dispatch it explicitly on the tag instead.
      - name: Build standalone binaries for the tag
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./apps/cli/package.json').version")"
          gh workflow run cli-binaries.yml --ref "$tag"
