name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_native:
        description: Build native engine matrix before publish
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-intent:
    name: detect release intent
    runs-on: ubuntu-latest
    outputs:
      needs_native_build: ${{ steps.intent.outputs.needs_native_build }}
    steps:
      - id: intent
        shell: bash
        run: |
          needs_native="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.build_native }}" = "true" ]; then
              needs_native="true"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            msg="${{ github.event.head_commit.message }}"
            if printf '%s' "$msg" | grep -qiE '^chore: version packages'; then
              needs_native="true"
            fi
          fi

          echo "needs_native_build=$needs_native" >> "$GITHUB_OUTPUT"
          echo "native engine build required: $needs_native"

  build-engine:
    name: build native engines
    needs: release-intent
    if: needs.release-intent.outputs.needs_native_build == 'true'
    uses: ./.github/workflows/native-engine-release.yml

  release:
    name: version or publish
    needs: [release-intent, build-engine]
    if: |
      always() &&
      needs.release-intent.result == 'success' &&
      (needs.release-intent.outputs.needs_native_build != 'true' || needs.build-engine.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.release-intent.outputs.needs_native_build == 'true'
        with:
          name: native-packages-all
          path: native-packages

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run scripts/publish-release.ts
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
