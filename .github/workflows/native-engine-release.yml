name: Native engine release

on:
  workflow_call:
    inputs:
      version:
        description: Semver to pack into native packages
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver to pack (defaults to apps/cli version)
        required: false
        type: string

# Never cancel an in-flight build: a manual dispatch during a release.yml run
# would otherwise kill the release's engine build mid-publish. Same-ref runs
# queue instead - the build is idempotent so queuing is safe.
concurrency:
  group: native-engine-release-${{ github.ref }}
  cancel-in-progress: false

# Default read-only; the build job escalates only what attestations need.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.id }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zigbuild: true
            abi_mode: glibc
            container: debian:11-slim
            binary: sweep-engine
          - id: linux-64-musl
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zigbuild: false
            abi_mode: musl-static
            container: alpine:3.21
            binary: sweep-engine
          - id: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zigbuild: true
            abi_mode: glibc
            container: debian:11-slim
            binary: sweep-engine
          - id: linux-arm64-musl
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zigbuild: false
            abi_mode: musl-static
            container: alpine:3.21
            binary: sweep-engine
          - id: darwin-64
            runs-on: macos-15-intel
            target: x86_64-apple-darwin
            zigbuild: false
            abi_mode: ""
            container: ""
            binary: sweep-engine
          - id: darwin-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            zigbuild: false
            abi_mode: ""
            container: ""
            binary: sweep-engine
          - id: windows-64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            zigbuild: false
            abi_mode: ""
            container: ""
            binary: sweep-engine.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Setup Zig for glibc 2.17 floor
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-zigbuild@0.24.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release engine (glibc 2.17 via cargo-zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release -p sweep-engine-cli --target ${{ matrix.target }}.2.17 --locked

      - name: Build release engine
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release -p sweep-engine-cli --target ${{ matrix.target }} --locked

      - name: Pack native package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/cli/package.json').version")
          fi
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          bun run packages/engine-native/scripts/pack.ts --platform ${{ matrix.id }} --binary "$BINARY" --version "$VERSION"

      - name: Verify Linux ELF ABI floor
        if: matrix.abi_mode != ''
        shell: bash
        run: |
          bun run packages/engine-native/scripts/check-elf-abi.ts \
            --binary "native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}" \
            --mode "${{ matrix.abi_mode }}" \
            --max-glibc 2.17

      - name: Verify packaged binary
        shell: bash
        run: bun run packages/engine-native/scripts/verify-binary.ts --binary "native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}"

      - name: Smoke-run engine in target Linux container
        if: matrix.container != ''
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/proj/node_modules"
          printf 'container-smoke' > "$tmp/proj/node_modules/file"
          docker run --rm \
            -v "${{ github.workspace }}/native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}:/usr/local/bin/sweep-engine:ro" \
            -v "$tmp/proj:/work/proj:ro" \
            "${{ matrix.container }}" \
            sh -eu -c '
              /usr/local/bin/sweep-engine --version
              /usr/local/bin/sweep-engine --capabilities
              out="$(/usr/local/bin/sweep-engine scan /work/proj < /dev/null)"
              printf "%s\n" "$out" | grep -q "node_modules"
            '

      - name: Smoke - installed package under Alpine with glibc compatibility layer
        if: matrix.abi_mode == 'musl-static'
        shell: bash
        run: |
          bunx turbo run build --filter=@kitsunekode/sweep
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          glibc_id="${{ matrix.id }}"
          glibc_id="${glibc_id%-musl}"
          mkdir -p "$tmp/app/node_modules/@kitsunekode/sweep/dist" \
                   "$tmp/app/node_modules/@kitsunekode/sweep-engine-$glibc_id/bin" \
                   "$tmp/app/node_modules/@kitsunekode/sweep-engine-${{ matrix.id }}/bin" \
                   "$tmp/proj/node_modules"
          cp apps/cli/package.json "$tmp/app/node_modules/@kitsunekode/sweep/package.json"
          cp apps/cli/dist/sweep.js "$tmp/app/node_modules/@kitsunekode/sweep/dist/sweep.js"
          cp "native-packages/$glibc_id/package.json" \
             "$tmp/app/node_modules/@kitsunekode/sweep-engine-$glibc_id/package.json"
          printf '#!/bin/sh\necho wrong-glibc-package >&2\nexit 99\n' \
            > "$tmp/app/node_modules/@kitsunekode/sweep-engine-$glibc_id/bin/${{ matrix.binary }}"
          chmod 755 "$tmp/app/node_modules/@kitsunekode/sweep-engine-$glibc_id/bin/${{ matrix.binary }}"
          cp "native-packages/${{ matrix.id }}/package.json" \
             "$tmp/app/node_modules/@kitsunekode/sweep-engine-${{ matrix.id }}/package.json"
          cp "native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}" \
             "$tmp/app/node_modules/@kitsunekode/sweep-engine-${{ matrix.id }}/bin/${{ matrix.binary }}"
          chmod 755 "$tmp/app/node_modules/@kitsunekode/sweep-engine-${{ matrix.id }}/bin/${{ matrix.binary }}"
          printf 'alpine-compat-smoke' > "$tmp/proj/node_modules/file"
          docker run --rm \
            -v "$tmp/app:/app:ro" \
            -v "$tmp/proj:/work/proj:ro" \
            node:20-alpine \
            sh -eu -c '
              apk add --no-cache gcompat libc6-compat >/dev/null
              out="$(node /app/node_modules/@kitsunekode/sweep/dist/sweep.js scan /work/proj --engine rust --json)"
              printf "%s\n" "$out" | grep -q "node_modules"
            '

      - name: Verify packaged apply outcomes and cancellation
        shell: bash
        # github.workspace is a native path (D:\a\... on Windows) - $PWD under
        # bash is MSYS form (/d/a/...), which the test's existsSync may not
        # resolve, silently skipping every rust-gated assertion.
        run: SWEEP_ENGINE_PATH="${{ github.workspace }}/native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}" bun test packages/core/src/engine.test.ts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-package-${{ matrix.id }}
          path: native-packages/${{ matrix.id }}
          retention-days: 7

  merge:
    name: merge native packages
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*
          path: artifacts

      - name: Normalize native-packages layout
        run: |
          mkdir -p native-packages
          for dir in artifacts/native-package-*; do
            id=$(basename "$dir" | sed 's/native-package-//')
            rm -rf "native-packages/$id"
            mv "$dir" "native-packages/$id"
          done
          find native-packages -maxdepth 3 -type f | sort

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages-all
          path: native-packages
          retention-days: 7
