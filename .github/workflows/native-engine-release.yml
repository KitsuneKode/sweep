name: Native engine release

on:
  workflow_call:
    inputs:
      version:
        description: Semver to pack into native packages
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver to pack (defaults to apps/cli version)
        required: false
        type: string

# Never cancel an in-flight build: a manual dispatch during a release.yml run
# would otherwise kill the release's engine build mid-publish. Same-ref runs
# queue instead - the build is idempotent so queuing is safe.
concurrency:
  group: native-engine-release-${{ github.ref }}
  cancel-in-progress: false

# Build + artifact upload only - nothing here writes to the repo or releases.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.id }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: sweep-engine
          - id: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: sweep-engine
          - id: darwin-64
            runs-on: macos-15-intel
            target: x86_64-apple-darwin
            binary: sweep-engine
          - id: darwin-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            binary: sweep-engine
          - id: windows-64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            binary: sweep-engine.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: cargo build --release
        run: cargo build --release -p sweep-engine-cli --target ${{ matrix.target }} --locked

      - name: Pack native package
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/cli/package.json').version")
          fi
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          bun run packages/engine-native/scripts/pack.ts --platform ${{ matrix.id }} --binary "$BINARY" --version "$VERSION"

      - name: Verify packaged binary
        shell: bash
        run: bun run packages/engine-native/scripts/verify-binary.ts --binary "native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}"

      - name: Verify packaged apply outcomes and cancellation
        shell: bash
        # github.workspace is a native path (D:\a\... on Windows) - $PWD under
        # bash is MSYS form (/d/a/...), which the test's existsSync may not
        # resolve, silently skipping every rust-gated assertion.
        run: SWEEP_ENGINE_PATH="${{ github.workspace }}/native-packages/${{ matrix.id }}/bin/${{ matrix.binary }}" bun test packages/core/src/engine.test.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-${{ matrix.id }}
          path: native-packages/${{ matrix.id }}
          retention-days: 7

  merge:
    name: merge native packages
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-package-*
          path: artifacts

      - name: Normalize native-packages layout
        run: |
          mkdir -p native-packages
          for dir in artifacts/native-package-*; do
            id=$(basename "$dir" | sed 's/native-package-//')
            rm -rf "native-packages/$id"
            mv "$dir" "native-packages/$id"
          done
          find native-packages -maxdepth 3 -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-packages-all
          path: native-packages
          retention-days: 7
