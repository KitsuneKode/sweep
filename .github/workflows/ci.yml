name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo. Jobs that need more must ask for it themselves.
permissions:
  contents: read

# A missing native test engine must fail qualification, not pass empty tests.
env:
  SWEEP_REQUIRE_RUST_TESTS: "1"

jobs:
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches retired runner labels, bad expressions and shell mistakes in
      # workflows, none of which show up until the affected job is triggered.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check critical dependency advisories
        run: bun audit --audit-level critical

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Validate parity golden candidate ids
        run: bun run fixtures:validate-goldens

      - name: Validate documentation links
        run: bun run check:docs

      # turbo's experimentalCargoWorkspaces runs `cargo metadata` on every
      # invocation, and the integration-tests package depends on the
      # sweep-engine-cli build - provision Rust explicitly instead of relying
      # on whatever the runner image happens to ship.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The UI tests require the native engine (SWEEP_REQUIRE_RUST_TESTS) but
      # turbo does not order them after the cargo build. A warm rust-cache hid
      # that; a cold one fails the job. Build it first, like cross-platform.
      - name: Build native engine for the UI tests
        run: cargo build -p sweep-engine-cli --locked

      - name: Check, build, and preflight
        run: bunx turbo run check build preflight --filter "@kitsunekode/*" --continue

  node-compat:
    name: node compatibility (22.12, 22, 24, 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI bundle
        run: bun run --cwd apps/cli build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.x"

      - name: Pack @kitsunekode/sweep tarball
        run: |
          mkdir -p "$RUNNER_TEMP/sweep-pack"
          npm pack -w @kitsunekode/sweep --pack-destination "$RUNNER_TEMP/sweep-pack"

      - name: Verify installed tarball on Node 22.12.x (optional deps omitted)
        run: bun run scripts/smoke-min-node.ts --expect-prefix 22.12. --tarball "$RUNNER_TEMP"/sweep-pack/kitsunekode-sweep-*.tgz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Verify installed tarball on latest Node 22.x (optional deps omitted)
        run: bun run scripts/smoke-min-node.ts --expect-prefix 22. --tarball "$RUNNER_TEMP"/sweep-pack/kitsunekode-sweep-*.tgz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Verify installed tarball on latest Node 24.x (optional deps omitted)
        run: bun run scripts/smoke-min-node.ts --expect-prefix 24. --tarball "$RUNNER_TEMP"/sweep-pack/kitsunekode-sweep-*.tgz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"

      - name: Verify installed tarball on latest Node 26.x (optional deps omitted)
        run: bun run scripts/smoke-min-node.ts --expect-prefix 26. --tarball "$RUNNER_TEMP"/sweep-pack/kitsunekode-sweep-*.tgz

  docs:
    name: documentation foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1
      - name: Check and prerender docs
        run: bun run docs:check
      - name: Validate prerendered content
        run: bun run --cwd apps/docs smoke

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Validate parity golden candidate ids
        run: bun run fixtures:validate-goldens

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Rust fmt, clippy, and tests via turbo
        run: bunx turbo run "sweep-rust#fmt:check" "sweep-rust#lint" "sweep-rust#test" --continue

      - name: Audit Rust dependencies against RustSec
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: Build release engine and CLI for Linux qualification
        run: |
          cargo build --release -p sweep-engine-cli --locked
          bun run build

      - name: Qualify result delivery and apply cancellation
        run: python3 scripts/smoke-apply-pipe.py

      - name: Qualify bounded resources, repeated scans and slow consumers
        run: |
          python3 scripts/resource-stress.py --files 4096 --repeats 2 \
            --fds 64 --rss-mb 768 --fixture-parent "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/sweep-resource-stress.json"

      - name: Qualify focused deletion and successful session exit through a Linux PTY
        run: |
          python3 scripts/smoke-focused-ui.py
          python3 scripts/smoke-focused-ui.py --size-override --engine rust
          python3 scripts/smoke-focused-ui.py --size-override --engine js
          python3 scripts/smoke-focused-ui.py --exit-signal SIGHUP
          python3 scripts/smoke-focused-ui.py --exit-signal SIGTERM

      - name: Qualify terminal close during active native removal
        run: |
          python3 scripts/smoke-active-ui.py --exit-signal SIGHUP
          python3 scripts/smoke-active-ui.py --exit-signal SIGTERM

      - name: Qualify live UI delivery and update stability
        run: bun run packages/ui/benchmarks/stream-render.tsx --candidates 5000

      - name: Validate generated completion syntax
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish tmux
          for shell in bash zsh fish; do
            node apps/cli/dist/sweep.js completions "$shell" > "$RUNNER_TEMP/sweep-completion.$shell"
            "$shell" -n "$RUNNER_TEMP/sweep-completion.$shell"
          done

      - name: Install local tarballs and verify owned scan-save-apply
        run: bun run scripts/smoke-package.ts --online

      # Intentionally Linux-only: scripts/smoke-installed-ui.ts uses tmux, sh,
      # and a Unix domain socket under /tmp, so macOS/Windows runners do not run it.
      - name: Install packed CLI globally over old @opentui/core and verify UI in tmux PTY (Linux-only)
        run: bun run scripts/smoke-installed-ui.ts

      - name: Qualify nested bind mounts in a private namespace
        shell: bash
        run: |
          if unshare --user --map-root-user --mount true; then
            python3 scripts/qualify-linux-mounts.py
          else
            # Ubuntu can restrict unprivileged user namespaces. Still run the
            # real test in a private mount namespace on this disposable VM.
            original_ns="$(readlink /proc/self/ns/mnt)"
            sudo --preserve-env=PATH unshare --mount --propagation private \
              python3 scripts/qualify-linux-mounts.py --inside "$original_ns"
          fi

      - name: Compile and verify self-contained standalone
        run: bun run scripts/verify-standalone.ts

      - name: Qualify deep native deletion with bounded descriptors
        run: python3 scripts/qualify-linux-deletion.py --output "$RUNNER_TEMP/sweep-deep-deletion.json"

  platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SWEEP_ENGINE_PATH: ${{ github.workspace }}/target/debug/sweep-engine${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Typecheck + pure-TS tests on every OS. The TUI itself needs a TTY and
      # OpenTUI native FFI (Bun), so it is smoke-checked via unit render tests
      # only here. The installed-UI tmux PTY smoke (scripts/smoke-installed-ui.ts)
      # is intentionally Linux-only and runs in the Linux `rust` job; macOS and
      # Windows runners do not run it. Physical terminal and non-Linux PTY
      # qualification remain separate.
      - name: Typecheck CLI workspaces
        run: bunx turbo run typecheck --filter "@kitsunekode/*"

      # Native assertions must execute on every runner, not silently skip
      # because the binary was only built after the Bun unit tests.
      - name: Build native engine before contract tests
        run: cargo build -p sweep-engine-cli --locked

      - name: Unit tests (core + protocol + ui + cli)
        run: |
          bun test packages/core packages/protocol packages/ui apps/cli

      # The Rust engine's bugs live in platform code (reparse points, verbatim
      # paths, ignore separators) - Linux-only Rust CI left every one of them
      # invisible. Parity insta tests run inside `cargo test`.
      - name: Rust lint including platform tests
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests (walk, engine, parity)
        run: cargo test --workspace --locked

      - name: Build CLI bundle
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Build release engine for installed package qualification
        run: cargo build --release -p sweep-engine-cli --locked

      - name: Install local tarballs and verify owned scan-save-apply
        run: bun run scripts/smoke-package.ts --online

      - name: Compile and verify self-contained standalone
        run: bun run scripts/verify-standalone.ts

      - name: Qualify deep native deletion with bounded descriptors
        if: runner.os == 'Linux'
        run: python3 scripts/qualify-linux-deletion.py --output "$RUNNER_TEMP/sweep-deep-deletion.json"

      - name: Qualify Windows PowerShell installer (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/integration/install-ps1.test.ps1 -TestBinaryPath target/release/sweep-engine.exe
          $ps51Exit = $LASTEXITCODE
          pwsh -NoProfile -File tests/integration/install-ps1.test.ps1 -TestBinaryPath target/release/sweep-engine.exe
          $ps7Exit = $LASTEXITCODE
          if ($ps51Exit -ne 0 -or $ps7Exit -ne 0) {
            Write-Host "::error::install-ps1 tests failed (Windows PowerShell 5.1 exit=$ps51Exit, PowerShell 7 exit=$ps7Exit)"
            if ($ps51Exit -ne 0) { exit $ps51Exit } else { exit $ps7Exit }
          }

      - name: Smoke - scan a temp tree (no deletion, no TTY)
        shell: bash
        run: |
          node apps/cli/dist/sweep.js scan . --json > /dev/null || exit 1
          node apps/cli/dist/sweep.js doctor --json > /dev/null || [ $? -eq 5 ] || exit 1
