name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Validate parity golden candidate ids
        run: bun run fixtures:validate-goldens

      - name: Check, build, and preflight
        run: bunx turbo run check build preflight

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Validate parity golden candidate ids
        run: bun run fixtures:validate-goldens

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace
        run: cargo clippy --workspace -- -D warnings

  platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      # Typecheck + pure-TS tests on every OS. The TUI itself needs a TTY and
      # OpenTUI native FFI (Bun), so it is smoke-checked via unit render tests
      # only; interactive verification stays manual/local by design.
      - name: Typecheck all workspaces
        run: bunx turbo run typecheck

      - name: Unit tests (core + protocol + ui)
        run: |
          bun test packages/core packages/protocol packages/ui

      - name: Build CLI bundle
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Smoke — scan a temp tree (no deletion, no TTY)
        shell: bash
        run: |
          node apps/cli/dist/sweep.js scan . --json > /dev/null || exit 1
          node apps/cli/dist/sweep.js doctor --json > /dev/null || exit 1
