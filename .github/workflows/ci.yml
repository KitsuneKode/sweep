name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo. Jobs that need more must ask for it themselves.
permissions:
  contents: read

# A missing native test engine must fail qualification, not pass empty tests.
env:
  SWEEP_REQUIRE_RUST_TESTS: "1"

jobs:
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches retired runner labels, bad expressions and shell mistakes in
      # workflows, none of which show up until the affected job is triggered.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Validate parity golden candidate ids
        run: bun run fixtures:validate-goldens

      - name: Validate documentation links
        run: bun run check:docs

      # turbo's experimentalCargoWorkspaces runs `cargo metadata` on every
      # invocation, and the integration-tests package depends on the
      # sweep-engine-cli build - provision Rust explicitly instead of relying
      # on whatever the runner image happens to ship.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check, build, and preflight
        run: bunx turbo run check build preflight --filter "@kitsunekode/*" --continue

  docs:
    name: documentation foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
      - name: Check and prerender docs
        run: bun run docs:check
      - name: Validate prerendered content
        run: bun run --cwd apps/docs smoke

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - name: Validate parity golden candidate ids
        run: bun run fixtures:validate-goldens

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Rust fmt, clippy, and tests via turbo
        run: bunx turbo run "sweep-rust#fmt:check" "sweep-rust#lint" "sweep-rust#test" --continue

      - name: Build release engine and CLI for Linux qualification
        run: |
          cargo build --release -p sweep-engine-cli --locked
          bun run build

      - name: Install local tarballs and verify owned scan-save-apply
        run: bun run scripts/smoke-package.ts --online

      - name: Qualify nested bind mounts in a private namespace
        shell: bash
        run: |
          if unshare --user --map-root-user --mount true; then
            python3 scripts/qualify-linux-mounts.py
          else
            # Ubuntu can restrict unprivileged user namespaces. Still run the
            # real test in a private mount namespace on this disposable VM.
            original_ns="$(readlink /proc/self/ns/mnt)"
            sudo --preserve-env=PATH unshare --mount --propagation private \
              python3 scripts/qualify-linux-mounts.py --inside "$original_ns"
          fi

      - name: Compile and verify self-contained standalone
        run: bun run scripts/verify-standalone.ts

  platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SWEEP_ENGINE_PATH: ${{ github.workspace }}/target/debug/sweep-engine${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync parity fixture trees
        run: bun run fixtures:sync

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Typecheck + pure-TS tests on every OS. The TUI itself needs a TTY and
      # OpenTUI native FFI (Bun), so it is smoke-checked via unit render tests
      # only; interactive verification stays manual/local by design.
      - name: Typecheck CLI workspaces
        run: bunx turbo run typecheck --filter "@kitsunekode/*"

      # Native assertions must execute on every runner, not silently skip
      # because the binary was only built after the Bun unit tests.
      - name: Build native engine before contract tests
        run: cargo build -p sweep-engine-cli --locked

      - name: Unit tests (core + protocol + ui + cli)
        run: |
          bun test packages/core packages/protocol packages/ui apps/cli

      # The Rust engine's bugs live in platform code (reparse points, verbatim
      # paths, ignore separators) - Linux-only Rust CI left every one of them
      # invisible. Parity insta tests run inside `cargo test`.
      - name: Rust lint including platform tests
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests (walk, engine, parity)
        run: cargo test --workspace --locked

      - name: Build CLI bundle
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Build release engine for installed package qualification
        run: cargo build --release -p sweep-engine-cli --locked

      - name: Install local tarballs and verify owned scan-save-apply
        run: bun run scripts/smoke-package.ts --online

      - name: Compile and verify self-contained standalone
        run: bun run scripts/verify-standalone.ts

      - name: Smoke - scan a temp tree (no deletion, no TTY)
        shell: bash
        run: |
          node apps/cli/dist/sweep.js scan . --json > /dev/null || exit 1
          node apps/cli/dist/sweep.js doctor --json > /dev/null || [ $? -eq 5 ] || exit 1
