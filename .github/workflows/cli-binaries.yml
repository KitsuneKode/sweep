name: CLI Binaries

# Builds standalone `sweep` executables on native runners and packs them into
# the platform workspace packages (@kitsunekode/sweep-<id>). Invoked as part
# of the changesets release flow (release.yml → build-cli job) so versions
# stay locked via the changesets `fixed` group — no tags, fully automated.

on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
          - id: darwin-x64
            os: macos-13
          - id: linux-x64
            os: ubuntu-latest
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: win-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bundle first so dist/sweep-ui.js exists for the JS fallback package;
      # the standalone compile itself starts from bin-standalone.ts and embeds
      # this platform's OpenTUI natives via the static UI import graph.
      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64) out="sweep-win-x64.exe" ;;
            *)       out="sweep-${{ matrix.id }}" ;;
          esac
          bun run scripts/build-standalone.ts "" "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Smoke — embedded UI probe + version
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version

      # Packs the binary into packages/platforms/<id>/bin/ — the workspace
      # package that changesets publishes alongside @kitsunekode/sweep.
      - name: Pack platform package
        shell: bash
        run: bun run packages/cli-native/scripts/pack.ts --platform "${{ matrix.id }}" --binary "$OUT"

      - name: Upload packed platform package
        uses: actions/upload-artifact@v4
        with:
          name: cli-platform-${{ matrix.id }}
          path: packages/platforms/${{ matrix.id }}/

  attach:
    name: attach raw binaries to GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download packed platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: cli-platform-*
          merge-multiple: true
          path: platforms

      - name: Attach binaries
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || {
            echo "no release yet (workflow_dispatch validation run); skipping attach";
            exit 0;
          }
          gh release upload "$GITHUB_REF_NAME" platforms/*/bin/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
