name: CLI Binaries

# Builds standalone `sweep` executables (Bun compile with embedded OpenTUI
# native assets) and attaches them to the GitHub release for the tag.
# Intentionally decoupled from release.yml's changesets/npm flow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
          - id: darwin-x64
            os: macos-15-intel
          - id: linux-x64
            os: ubuntu-latest
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: win-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64) out="sweep-${{ matrix.id }}.exe" ;;
            *)       out="sweep-${{ matrix.id }}" ;;
          esac
          bun run scripts/build-standalone.ts "" "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Smoke - embedded UI probe + version
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version

      - name: Generate checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
          fi
          cat "$OUT.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sweep-${{ matrix.id }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256

  attach:
    name: attach binaries to release
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist-bin

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
