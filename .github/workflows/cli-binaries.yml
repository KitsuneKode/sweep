name: CLI Binaries

# Builds standalone `sweep` executables (Bun compile with embedded OpenTUI
# native assets) and attaches them to the GitHub release for the tag.
# Intentionally decoupled from release.yml's changesets/npm flow.

on:
  push:
    tags:
      - "v*"
      - "@kitsunekode/sweep@*"
  workflow_dispatch: {}

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
          - id: darwin-x64
            os: macos-15-intel
          - id: linux-x64
            os: ubuntu-latest
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: win-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rust must exist before any turbo invocation: turbo resolves cargo
      # workspaces via `cargo metadata` and the CLI build pulls in the engine
      # build task.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Build embedded native engine
        run: cargo build --release -p sweep-engine-cli --locked

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64) out="sweep-${{ matrix.id }}.exe" ;;
            *)       out="sweep-${{ matrix.id }}" ;;
          esac
          bun run scripts/build-standalone.ts "" "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Smoke - embedded UI probe + version
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version
          bun run scripts/smoke-standalone.ts "./$OUT"

      - name: Generate checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
          fi
          cat "$OUT.sha256"

      - name: Compress and verify standalone download
        shell: bash
        run: bun run apps/cli/scripts/compress-standalone.ts "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sweep-${{ matrix.id }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
            ${{ env.OUT }}.gz
            ${{ env.OUT }}.gz.sha256

  attach:
    name: attach binaries to release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/@kitsunekode/sweep@')
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist-bin

      - name: Resolve release version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            @kitsunekode/sweep@*) version="${TAG#@kitsunekode/sweep@}" ;;
            v*) version="${TAG#v}" ;;
            *) echo "Unsupported release tag"; exit 1 ;;
          esac
          prerelease="false"
          [[ "$version" != *-* ]] || prerelease="true"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist-bin/*
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tap lives in a separate repo, so GITHUB_TOKEN cannot reach it -
      # a fine-grained PAT with contents:write on homebrew-tap is required.
      # Skip cleanly until the secret exists rather than failing the release.
      - name: Check for tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_GITHUB_TOKEN not set; skipping Homebrew formula bump"
          fi

      - name: Bump Homebrew tap formula
        if: steps.tap.outputs.present == 'true' && steps.version.outputs.prerelease != 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          version="$VERSION"
          gh repo clone KitsuneKode/homebrew-tap tap -- --depth 1
          cd tap
          bin/update-formula "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sweep.rb
          if git diff --cached --quiet; then
            echo "formula already at $version"
          else
            git commit -m "sweep $version"
            git push
          fi
