name: CLI Binaries

# Builds standalone `sweep` executables (Bun compile with embedded OpenTUI
# native assets and embedded Rust engine), qualifies the Homebrew formula
# against the built archives, attests build provenance, and uploads workflow
# artifacts with read-only contents permission.
#
# Privileged tag qualification, GitHub Release asset attachment (`contents: write`),
# and downstream Homebrew/Scoop pushes run exclusively from canonical `main` in
# `.github/workflows/release-downstream.yml` via `workflow_run`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
            cargo_target: aarch64-apple-darwin
            bun_target: ""
            zigbuild: false
            engine_abi_mode: ""
            standalone_abi_mode: ""
            embedded_so_mode: ""
            container: ""
          - id: darwin-x64
            os: macos-15-intel
            cargo_target: x86_64-apple-darwin
            bun_target: ""
            zigbuild: false
            engine_abi_mode: ""
            standalone_abi_mode: ""
            embedded_so_mode: ""
            container: ""
          - id: linux-x64
            os: ubuntu-latest
            cargo_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            zigbuild: true
            engine_abi_mode: glibc
            standalone_abi_mode: glibc
            embedded_so_mode: glibc-so
            container: debian:11-slim
          - id: linux-x64-musl
            os: ubuntu-latest
            cargo_target: x86_64-unknown-linux-musl
            bun_target: bun-linux-x64-musl
            zigbuild: false
            engine_abi_mode: musl-static
            standalone_abi_mode: musl-dynamic
            embedded_so_mode: musl-so
            container: alpine:3.21
          - id: linux-arm64
            os: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            zigbuild: true
            engine_abi_mode: glibc
            standalone_abi_mode: glibc
            embedded_so_mode: glibc-so
            container: debian:11-slim
          - id: linux-arm64-musl
            os: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-musl
            bun_target: bun-linux-arm64-musl
            zigbuild: false
            engine_abi_mode: musl-static
            standalone_abi_mode: musl-dynamic
            embedded_so_mode: musl-so
            container: alpine:3.21
          - id: win-x64
            os: windows-latest
            cargo_target: x86_64-pc-windows-msvc
            bun_target: ""
            zigbuild: false
            engine_abi_mode: ""
            standalone_abi_mode: ""
            embedded_so_mode: ""
            container: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rust must exist before any turbo invocation: turbo resolves cargo
      # workspaces via `cargo metadata` and the CLI build pulls in the engine
      # build task.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1

      - name: Add Rust target
        run: rustup target add ${{ matrix.cargo_target }}

      - name: Setup Zig for glibc 2.17 floor
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-zigbuild@0.24.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Build embedded native engine (glibc 2.17 via cargo-zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release -p sweep-engine-cli --target ${{ matrix.cargo_target }}.2.17 --locked

      - name: Build embedded native engine
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release -p sweep-engine-cli --target ${{ matrix.cargo_target }} --locked

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64)
              out="sweep-${{ matrix.id }}.exe"
              engine_out="sweep-engine-${{ matrix.id }}.exe"
              engine_src="target/${{ matrix.cargo_target }}/release/sweep-engine.exe"
              ;;
            *)
              out="sweep-${{ matrix.id }}"
              engine_out="sweep-engine-${{ matrix.id }}"
              engine_src="target/${{ matrix.cargo_target }}/release/sweep-engine"
              ;;
          esac
          metafile="build-${{ matrix.id }}.meta.json"
          cp "$engine_src" "$engine_out"
          bun run scripts/build-standalone.ts "${{ matrix.bun_target }}" "$out" \
            --engine "$engine_src" \
            --metafile "$metafile"
          {
            echo "OUT=$out"
            echo "ENGINE_OUT=$engine_out"
            echo "BUILD_METAFILE=$metafile"
          } >> "$GITHUB_ENV"

      - name: Verify Linux ELF ABI floor (standalone, embedded engine, and OpenTUI .so)
        if: matrix.engine_abi_mode != ''
        shell: bash
        run: |
          bun run packages/engine-native/scripts/check-elf-abi.ts \
            --binary "./$ENGINE_OUT" \
            --mode "${{ matrix.engine_abi_mode }}" \
            --max-glibc 2.17
          bun run packages/engine-native/scripts/check-elf-abi.ts \
            --binary "./$OUT" \
            --mode "${{ matrix.standalone_abi_mode }}" \
            --max-glibc 2.17 \
            --metafile "./$BUILD_METAFILE" \
            --embedded-so-mode "${{ matrix.embedded_so_mode }}" \
            --verify-embedded "./$ENGINE_OUT:${{ matrix.engine_abi_mode }}"

      - name: Smoke - host standalone and engine
        if: matrix.standalone_abi_mode != 'musl-dynamic'
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version
          bun run scripts/smoke-standalone.ts "./$OUT"
          bun run packages/engine-native/scripts/verify-binary.ts --binary "./$ENGINE_OUT"

      - name: Smoke - host static musl engine
        if: matrix.standalone_abi_mode == 'musl-dynamic'
        shell: bash
        run: bun run packages/engine-native/scripts/verify-binary.ts --binary "./$ENGINE_OUT"

      - name: Smoke - run standalone and engine in target Linux container
        if: matrix.container != ''
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/proj/node_modules"
          printf 'container-smoke' > "$tmp/proj/node_modules/file"
          docker run --rm \
            -v "${{ github.workspace }}/$OUT:/usr/local/bin/sweep:ro" \
            -v "${{ github.workspace }}/$ENGINE_OUT:/usr/local/bin/sweep-engine:ro" \
            -v "$tmp/proj:/work/proj:ro" \
            "${{ matrix.container }}" \
            sh -eu -c '
              /usr/local/bin/sweep-engine --version
              eng="$(/usr/local/bin/sweep-engine scan /work/proj < /dev/null)"
              printf "%s\n" "$eng" | grep -q "node_modules"
              if command -v apk >/dev/null 2>&1; then
                # Bun musl standalone executables dynamically link libstdc++/libgcc.
                apk add --no-cache libstdc++ libgcc >/dev/null
              fi
              PATH="" /usr/local/bin/sweep --ui-probe
              PATH="" /usr/local/bin/sweep --version
              scan="$(PATH="" /usr/local/bin/sweep scan /work/proj --engine rust --json)"
              printf "%s\n" "$scan" | grep -q "node_modules"
            '

      - name: Generate checksum
        shell: bash
        run: |
          for binary in "$OUT" "$ENGINE_OUT"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$binary" > "$binary.sha256"
            else
              shasum -a 256 "$binary" > "$binary.sha256"
            fi
            cat "$binary.sha256"
          done

      - name: Compress and verify standalone download
        shell: bash
        run: |
          bun run apps/cli/scripts/compress-standalone.ts "$OUT"
          bun run apps/cli/scripts/compress-standalone.ts "$ENGINE_OUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.gz
            ${{ env.ENGINE_OUT }}
            ${{ env.ENGINE_OUT }}.gz

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-${{ matrix.id }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
            ${{ env.OUT }}.gz
            ${{ env.OUT }}.gz.sha256
            ${{ env.ENGINE_OUT }}
            ${{ env.ENGINE_OUT }}.sha256
            ${{ env.ENGINE_OUT }}.gz
            ${{ env.ENGINE_OUT }}.gz.sha256

  qualify-homebrew:
    name: qualify Homebrew formula
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist-bin

      - name: Smoke-install rendered formula from local tap with real .gz archive
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          version="$(node -p "require('./apps/cli/package.json').version")"
          tmp="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
            fi
            brew uninstall --force local/sweep-smoke/sweep >/dev/null 2>&1 || true
            brew untap local/sweep-smoke >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          # Render using the exact repository template and built checksums.
          bun run apps/cli/scripts/render-packaging.ts homebrew \
            --version "$version" \
            --dist-dir dist-bin \
            --template packaging/homebrew/sweep.rb.tmpl \
            --out "$tmp/sweep.rb"

          # Serve the built .gz archive locally and point the formula URL at it.
          python3 -m http.server 18765 --bind 127.0.0.1 --directory dist-bin >/dev/null 2>&1 &
          server_pid=$!
          sleep 1

          brew tap-new --no-git local/sweep-smoke >/dev/null
          tap_repo="$(brew --repository local/sweep-smoke)"
          mkdir -p "$tap_repo/Formula"
          sed "s|https://github.com/KitsuneKode/sweep/releases/download/v#{version}|http://127.0.0.1:18765|g" \
            "$tmp/sweep.rb" > "$tap_repo/Formula/sweep.rb"

          brew style local/sweep-smoke/sweep
          brew install --formula local/sweep-smoke/sweep
          installed_ver="$("$(brew --prefix)/bin/sweep" --version)"
          echo "brew installed sweep version: $installed_ver"
          printf '%s\n' "$installed_ver" | grep -q "$version"
          test -s "$(brew --prefix)/etc/bash_completion.d/sweep"
          test -s "$(brew --prefix)/share/zsh/site-functions/_sweep"
          test -s "$(brew --prefix)/share/fish/vendor_completions.d/sweep.fish"
          brew test local/sweep-smoke/sweep
