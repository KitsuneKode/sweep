name: CLI Binaries

# Builds standalone `sweep` executables (Bun compile with embedded OpenTUI
# native assets) and attaches them to the GitHub release for the tag.
# Intentionally decoupled from release.yml's changesets/npm flow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
          - id: darwin-x64
            os: macos-13
          - id: linux-x64
            os: ubuntu-latest
          - id: win-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64) out="sweep-${{ matrix.id }}.exe" ;;
            *)       out="sweep-${{ matrix.id }}" ;;
          esac
          bun run scripts/build-standalone.ts "" "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Smoke — embedded UI probe + version
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.id }}
          path: ${{ env.OUT }}

  attach:
    name: attach binaries to release
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-bin

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
