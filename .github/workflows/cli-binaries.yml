name: CLI Binaries

# Builds standalone `sweep` executables (Bun compile with embedded OpenTUI
# native assets and embedded Rust engine) and attaches them to the GitHub
# release for a qualified `v*` tag. Downstream Homebrew/Scoop updates run in
# the protected `release-downstream` environment from canonical `main`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Scope: all (build, attach, downstream) or downstream (retry Homebrew/Scoop from existing GitHub Release)"
        required: false
        type: choice
        default: all
        options:
          - all
          - downstream
      downstream:
        description: "Downstream channels to update for stable releases"
        required: false
        type: choice
        default: all
        options:
          - all
          - homebrew
          - scoop

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.id }}
    if: inputs.target != 'downstream'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
            cargo_target: aarch64-apple-darwin
            bun_target: ""
            zigbuild: false
            engine_abi_mode: ""
            standalone_abi_mode: ""
            embedded_so_mode: ""
            container: ""
          - id: darwin-x64
            os: macos-15-intel
            cargo_target: x86_64-apple-darwin
            bun_target: ""
            zigbuild: false
            engine_abi_mode: ""
            standalone_abi_mode: ""
            embedded_so_mode: ""
            container: ""
          - id: linux-x64
            os: ubuntu-latest
            cargo_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            zigbuild: true
            engine_abi_mode: glibc
            standalone_abi_mode: glibc
            embedded_so_mode: glibc-so
            container: debian:11-slim
          - id: linux-x64-musl
            os: ubuntu-latest
            cargo_target: x86_64-unknown-linux-musl
            bun_target: bun-linux-x64-musl
            zigbuild: false
            engine_abi_mode: musl-static
            standalone_abi_mode: musl-dynamic
            embedded_so_mode: musl-so
            container: alpine:3.21
          - id: linux-arm64
            os: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            zigbuild: true
            engine_abi_mode: glibc
            standalone_abi_mode: glibc
            embedded_so_mode: glibc-so
            container: debian:11-slim
          - id: linux-arm64-musl
            os: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-musl
            bun_target: bun-linux-arm64-musl
            zigbuild: false
            engine_abi_mode: musl-static
            standalone_abi_mode: musl-dynamic
            embedded_so_mode: musl-so
            container: alpine:3.21
          - id: win-x64
            os: windows-latest
            cargo_target: x86_64-pc-windows-msvc
            bun_target: ""
            zigbuild: false
            engine_abi_mode: ""
            standalone_abi_mode: ""
            embedded_so_mode: ""
            container: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rust must exist before any turbo invocation: turbo resolves cargo
      # workspaces via `cargo metadata` and the CLI build pulls in the engine
      # build task.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1

      - name: Add Rust target
        run: rustup target add ${{ matrix.cargo_target }}

      - name: Setup Zig for glibc 2.17 floor
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-zigbuild@0.24.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Build embedded native engine (glibc 2.17 via cargo-zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release -p sweep-engine-cli --target ${{ matrix.cargo_target }}.2.17 --locked

      - name: Build embedded native engine
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release -p sweep-engine-cli --target ${{ matrix.cargo_target }} --locked

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64)
              out="sweep-${{ matrix.id }}.exe"
              engine_out="sweep-engine-${{ matrix.id }}.exe"
              engine_src="target/${{ matrix.cargo_target }}/release/sweep-engine.exe"
              ;;
            *)
              out="sweep-${{ matrix.id }}"
              engine_out="sweep-engine-${{ matrix.id }}"
              engine_src="target/${{ matrix.cargo_target }}/release/sweep-engine"
              ;;
          esac
          metafile="build-${{ matrix.id }}.meta.json"
          cp "$engine_src" "$engine_out"
          bun run scripts/build-standalone.ts "${{ matrix.bun_target }}" "$out" \
            --engine "$engine_src" \
            --metafile "$metafile"
          {
            echo "OUT=$out"
            echo "ENGINE_OUT=$engine_out"
            echo "BUILD_METAFILE=$metafile"
          } >> "$GITHUB_ENV"

      - name: Verify Linux ELF ABI floor (standalone, embedded engine, and OpenTUI .so)
        if: matrix.engine_abi_mode != ''
        shell: bash
        run: |
          bun run packages/engine-native/scripts/check-elf-abi.ts \
            --binary "./$ENGINE_OUT" \
            --mode "${{ matrix.engine_abi_mode }}" \
            --max-glibc 2.17
          bun run packages/engine-native/scripts/check-elf-abi.ts \
            --binary "./$OUT" \
            --mode "${{ matrix.standalone_abi_mode }}" \
            --max-glibc 2.17 \
            --metafile "./$BUILD_METAFILE" \
            --embedded-so-mode "${{ matrix.embedded_so_mode }}" \
            --verify-embedded "./$ENGINE_OUT:${{ matrix.engine_abi_mode }}"

      - name: Smoke - host standalone and engine
        if: matrix.standalone_abi_mode != 'musl-dynamic'
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version
          bun run scripts/smoke-standalone.ts "./$OUT"
          bun run packages/engine-native/scripts/verify-binary.ts --binary "./$ENGINE_OUT"

      - name: Smoke - host static musl engine
        if: matrix.standalone_abi_mode == 'musl-dynamic'
        shell: bash
        run: bun run packages/engine-native/scripts/verify-binary.ts --binary "./$ENGINE_OUT"

      - name: Smoke - run standalone and engine in target Linux container
        if: matrix.container != ''
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/proj/node_modules"
          printf 'container-smoke' > "$tmp/proj/node_modules/file"
          docker run --rm \
            -v "${{ github.workspace }}/$OUT:/usr/local/bin/sweep:ro" \
            -v "${{ github.workspace }}/$ENGINE_OUT:/usr/local/bin/sweep-engine:ro" \
            -v "$tmp/proj:/work/proj:ro" \
            "${{ matrix.container }}" \
            sh -eu -c '
              /usr/local/bin/sweep-engine --version
              eng="$(/usr/local/bin/sweep-engine scan /work/proj < /dev/null)"
              printf "%s\n" "$eng" | grep -q "node_modules"
              if command -v apk >/dev/null 2>&1; then
                # Bun musl standalone executables dynamically link libstdc++/libgcc.
                apk add --no-cache libstdc++ libgcc >/dev/null
              fi
              PATH="" /usr/local/bin/sweep --ui-probe
              PATH="" /usr/local/bin/sweep --version
              scan="$(PATH="" /usr/local/bin/sweep scan /work/proj --engine rust --json)"
              printf "%s\n" "$scan" | grep -q "node_modules"
            '

      - name: Generate checksum
        shell: bash
        run: |
          for binary in "$OUT" "$ENGINE_OUT"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$binary" > "$binary.sha256"
            else
              shasum -a 256 "$binary" > "$binary.sha256"
            fi
            cat "$binary.sha256"
          done

      - name: Compress and verify standalone download
        shell: bash
        run: |
          bun run apps/cli/scripts/compress-standalone.ts "$OUT"
          bun run apps/cli/scripts/compress-standalone.ts "$ENGINE_OUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.gz
            ${{ env.ENGINE_OUT }}
            ${{ env.ENGINE_OUT }}.gz

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-${{ matrix.id }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
            ${{ env.OUT }}.gz
            ${{ env.OUT }}.gz.sha256
            ${{ env.ENGINE_OUT }}
            ${{ env.ENGINE_OUT }}.sha256
            ${{ env.ENGINE_OUT }}.gz
            ${{ env.ENGINE_OUT }}.gz.sha256

  qualify-homebrew:
    name: qualify Homebrew formula
    needs: binaries
    if: inputs.target != 'downstream'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist-bin

      - name: Smoke-install rendered formula from local tap with real .gz archive
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          version="$(node -p "require('./apps/cli/package.json').version")"
          tmp="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
            fi
            brew uninstall --force local/sweep-smoke/sweep >/dev/null 2>&1 || true
            brew untap local/sweep-smoke >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          # Render using the exact repository template and built checksums.
          bun run apps/cli/scripts/render-packaging.ts homebrew \
            --version "$version" \
            --dist-dir dist-bin \
            --template packaging/homebrew/sweep.rb.tmpl \
            --out "$tmp/sweep.rb"

          # Serve the built .gz archive locally and point the formula URL at it.
          python3 -m http.server 18765 --bind 127.0.0.1 --directory dist-bin >/dev/null 2>&1 &
          server_pid=$!
          sleep 1

          brew tap-new --no-git local/sweep-smoke >/dev/null
          tap_repo="$(brew --repository local/sweep-smoke)"
          mkdir -p "$tap_repo/Formula"
          sed "s|https://github.com/KitsuneKode/sweep/releases/download/v#{version}|http://127.0.0.1:18765|g" \
            "$tmp/sweep.rb" > "$tap_repo/Formula/sweep.rb"

          brew style local/sweep-smoke/sweep
          brew install --formula local/sweep-smoke/sweep
          installed_ver="$("$(brew --prefix)/bin/sweep" --version)"
          echo "brew installed sweep version: $installed_ver"
          printf '%s\n' "$installed_ver" | grep -q "$version"
          test -s "$(brew --prefix)/etc/bash_completion.d/sweep"
          test -s "$(brew --prefix)/share/zsh/site-functions/_sweep"
          test -s "$(brew --prefix)/share/fish/vendor_completions.d/sweep.fish"
          brew test local/sweep-smoke/sweep

  attach:
    name: attach binaries to release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    if: |
      always() &&
      github.repository == 'KitsuneKode/sweep' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (inputs.target == 'downstream' || needs.binaries.result == 'success')
    outputs:
      version: ${{ steps.version.outputs.number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag_sha: ${{ steps.version.outputs.tag_sha }}
      qualified: ${{ steps.qualify.outputs.qualified }}
    steps:
      - name: Download all binaries
        if: inputs.target != 'downstream'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist-bin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          path: src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Fetch canonical main ref
        working-directory: src
        run: git fetch origin main:refs/remotes/origin/main

      - name: Qualify release tag against canonical main, CI, and Release workflow
        id: qualify
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run apps/cli/scripts/verify-release-tag.ts \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --main-ref origin/main
          echo "qualified=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        shell: bash
        working-directory: src
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *) echo "Unsupported release tag"; exit 1 ;;
          esac
          prerelease="false"
          [[ "$version" != *-* ]] || prerelease="true"
          tag_sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          {
            echo "number=$version"
            echo "prerelease=$prerelease"
            echo "tag_sha=$tag_sha"
          } >> "$GITHUB_OUTPUT"

      # The release says what changed: its notes are this version's changelog
      # section, never an empty page beside the binaries.
      - name: Release notes from the changelog
        if: inputs.target != 'downstream'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          awk -v head="## $VERSION" '$0 == head { on = 1; next } /^## / && on { exit } on' \
            src/apps/cli/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::apps/cli/CHANGELOG.md has no section for $VERSION"; exit 1
          fi

      - name: Attach to GitHub release
        if: inputs.target != 'downstream'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist-bin/*
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: update Homebrew tap
    needs: attach
    environment: release-downstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: |
      github.repository == 'KitsuneKode/sweep' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.attach.result == 'success' &&
      needs.attach.outputs.qualified == 'true' &&
      needs.attach.outputs.prerelease != 'true' &&
      (inputs.downstream == '' || inputs.downstream == 'all' || inputs.downstream == 'homebrew')
    steps:
      - name: Check for tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_GITHUB_TOKEN not set; skipping Homebrew formula bump"
          fi

      # Always render templates and scripts from canonical `main`, never from tag content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.present == 'true'
        with:
          ref: main
          sparse-checkout: |
            apps/cli/scripts/render-packaging.ts
            packaging/homebrew/sweep.rb.tmpl
          sparse-checkout-cone-mode: false
          path: main-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.tap.outputs.present == 'true'
        with:
          bun-version: 1.4.2

      - name: Download release checksums
        if: steps.tap.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.attach.outputs.version }}
        run: |
          mkdir -p dist-bin
          gh release download "v$VERSION" \
            --repo KitsuneKode/sweep \
            -p 'sweep-darwin-arm64.gz.sha256' \
            -p 'sweep-darwin-x64.gz.sha256' \
            -p 'sweep-linux-arm64.gz.sha256' \
            -p 'sweep-linux-x64.gz.sha256' \
            -D dist-bin

      - name: Render and push Homebrew tap formula
        if: steps.tap.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.attach.outputs.version }}
        run: |
          version="$VERSION"
          # Bind git push authentication to the repo-scoped GH_TOKEN without echoing it.
          gh auth setup-git --hostname github.com
          gh repo clone KitsuneKode/homebrew-tap tap -- --depth 1
          bun run main-src/apps/cli/scripts/render-packaging.ts homebrew \
            --version "$version" \
            --dist-dir dist-bin \
            --template main-src/packaging/homebrew/sweep.rb.tmpl \
            --out tap/Formula/sweep.rb \
            --reject-downgrade
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sweep.rb
          if git diff --cached --quiet; then
            echo "formula already at $version"
          else
            git commit -m "sweep $version"
            git push origin HEAD
          fi

  update-scoop:
    name: update Scoop bucket
    needs: attach
    environment: release-downstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: |
      github.repository == 'KitsuneKode/sweep' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.attach.result == 'success' &&
      needs.attach.outputs.qualified == 'true' &&
      needs.attach.outputs.prerelease != 'true' &&
      (inputs.downstream == '' || inputs.downstream == 'all' || inputs.downstream == 'scoop')
    steps:
      - name: Check for Scoop bucket token
        id: scoop
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -n "${SCOOP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SCOOP_BUCKET_TOKEN not set; skipping Scoop bucket update"
          fi

      # Always render templates and scripts from canonical `main`, never from tag content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scoop.outputs.present == 'true'
        with:
          ref: main
          sparse-checkout: |
            apps/cli/scripts/render-packaging.ts
            packaging/scoop/sweep.json
          sparse-checkout-cone-mode: false
          path: main-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scoop.outputs.present == 'true'
        with:
          bun-version: 1.4.2

      - name: Download Windows checksum
        if: steps.scoop.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.attach.outputs.version }}
        run: |
          mkdir -p dist-bin
          gh release download "v$VERSION" \
            --repo KitsuneKode/sweep \
            -p 'sweep-win-x64.exe.sha256' \
            -D dist-bin

      - name: Render and push Scoop bucket manifest
        if: steps.scoop.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.attach.outputs.version }}
        run: |
          version="$VERSION"
          # Bind git push authentication to the repo-scoped GH_TOKEN without echoing it.
          gh auth setup-git --hostname github.com
          gh repo clone KitsuneKode/scoop-bucket scoop -- --depth 1
          mkdir -p scoop/bucket
          bun run main-src/apps/cli/scripts/render-packaging.ts scoop \
            --version "$version" \
            --dist-dir dist-bin \
            --template main-src/packaging/scoop/sweep.json \
            --out scoop/bucket/sweep.json \
            --reject-downgrade
          cd scoop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/sweep.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already at $version"
          else
            git commit -m "sweep $version"
            git push origin HEAD
          fi
