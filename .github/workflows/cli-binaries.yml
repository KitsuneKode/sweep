name: CLI Binaries

# Builds standalone `sweep` executables on native runners, packs them as
# @kitsunekode/sweep-<platform> npm packages, attaches binaries to the GitHub
# release for the tag, and publishes the platform packages to npm.
# Intentionally decoupled from release.yml's changesets flow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            os: macos-latest
          - id: darwin-x64
            os: macos-13
          - id: linux-x64
            os: ubuntu-latest
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: win-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bundle first so dist/sweep-ui.js exists for the JS fallback package;
      # the standalone compile itself starts from bin-standalone.ts and embeds
      # this platform's OpenTUI natives via the static UI import graph.
      - name: Bundle CLI + UI
        run: bunx turbo run build --filter=@kitsunekode/sweep

      - name: Compile standalone executable
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            win-x64) out="sweep-win-x64.exe" ;;
            *)       out="sweep-${{ matrix.id }}" ;;
          esac
          bun run scripts/build-standalone.ts "" "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Smoke — embedded UI probe + version
        shell: bash
        run: |
          "./$OUT" --ui-probe
          "./$OUT" --version

      - name: Pack platform npm package
        shell: bash
        run: bun run packages/cli-native/scripts/pack.ts --platform "${{ matrix.id }}" --binary "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.id }}
          path: native-packages/cli/${{ matrix.id }}/

  attach:
    name: attach binaries to release
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all packed packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: native-packages

      - name: Attach raw binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: native-packages/cli/*/bin/*

  publish:
    name: publish platform packages to npm
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    steps:
      - name: Download all packed packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: native-packages

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Publish @kitsunekode/sweep-* platform packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in native-packages/cli/*/; do
            (cd "$dir" && \
             npm_config_registry=https://registry.npmjs.org/ \
             bun x npm publish --access public --provenance) || exit 1
          done
