name: Release Downstream

# Updates downstream package channels (Homebrew tap, Scoop bucket) exclusively
# from canonical `main`. Triggered automatically when `CLI Binaries` completes
# for a `v*` tag, or manually dispatched on `main` for retries.
#
# This workflow definition is always loaded from `main` (never from a tag).
# `qualify` runs outside the `release-downstream` environment, checks out `main`,
# verifies the release tag with `verify-release-tag.ts` against `origin/main`,
# and confirms `qualify Homebrew formula` succeeded before `update-homebrew` or
# `update-scoop` enter the `release-downstream` environment.

on:
  workflow_run:
    workflows: ["CLI Binaries"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish downstream (e.g. vX.Y.Z)"
        required: true
        type: string
      downstream:
        description: "Downstream channels to update for stable releases"
        required: false
        type: choice
        default: all
        options:
          - all
          - homebrew
          - scoop

concurrency:
  group: release-downstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: qualify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    if: |
      github.repository == 'KitsuneKode/sweep' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == 'KitsuneKode/sweep' &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      )
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      tag_sha: ${{ steps.tag_sha.outputs.tag_sha }}
      qualified: ${{ steps.qualify.outputs.qualified }}
      homebrew_qualified: ${{ steps.homebrew_gate.outputs.qualified }}
    steps:
      - name: Resolve target release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$RUN_HEAD_BRANCH"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported release tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          prerelease="false"
          [[ "$version" != *-* ]] || prerelease="true"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Fetch canonical main ref and release tags
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin --tags

      - name: Verify release tag commit matches workflow run
        id: tag_sha
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$RUN_HEAD_SHA" != "$tag_sha" ]; then
            echo "::error::CLI Binaries run head_sha ($RUN_HEAD_SHA) does not match refs/tags/$TAG ($tag_sha)"
            exit 1
          fi
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Qualify release tag against canonical main, CI, and Release workflow
        id: qualify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          bun run apps/cli/scripts/verify-release-tag.ts \
            --repo "${{ github.repository }}" \
            --ref "refs/tags/$TAG" \
            --main-ref origin/main
          echo "qualified=true" >> "$GITHUB_OUTPUT"

      - name: Verify CLI Binaries attachment and Homebrew qualification
        id: homebrew_gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_SHA: ${{ steps.tag_sha.outputs.tag_sha }}
          DOWNSTREAM: ${{ inputs.downstream }}
        run: |
          check_run_jobs() {
            local run_id="$1"
            gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?per_page=100" \
              | bun -e '
                const data = JSON.parse(await Bun.stdin.text());
                const jobs = data.jobs ?? [];
                const ok = (name) => jobs.some((j) => j.name === name && j.status === "completed" && j.conclusion === "success");
                console.log([ok("qualify Homebrew formula"), ok("attach binaries to release")].join(" "));
              '
          }

          hb_qualified="false"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            read -r hb_qualified attach_ok <<< "$(check_run_jobs "$RUN_ID")"
            if [ "$attach_ok" != "true" ]; then
              echo "::error::CLI Binaries run $RUN_ID did not complete 'attach binaries to release' successfully"
              exit 1
            fi
            if [ "$hb_qualified" != "true" ]; then
              echo "::error::CLI Binaries run $RUN_ID did not pass 'qualify Homebrew formula'"
              exit 1
            fi
          else
            # Confirm the GitHub Release exists before publishing downstream channels.
            gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.tag_name' >/dev/null
            run_ids="$(gh api "repos/${{ github.repository }}/actions/workflows/cli-binaries.yml/runs?per_page=20" \
              | TAG="$TAG" TAG_SHA="$TAG_SHA" bun -e '
                const data = JSON.parse(await Bun.stdin.text());
                const matches = (data.workflow_runs ?? []).filter((r) =>
                  r.status === "completed" &&
                  r.head_branch === process.env.TAG &&
                  r.head_sha === process.env.TAG_SHA
                );
                for (const r of matches) console.log(r.id);
              ')"
            for rid in $run_ids; do
              read -r run_hb _ <<< "$(check_run_jobs "$rid")"
              if [ "$run_hb" = "true" ]; then
                hb_qualified="true"
                break
              fi
            done
            channel="${DOWNSTREAM:-all}"
            if [ "$hb_qualified" != "true" ] && { [ "$channel" = "all" ] || [ "$channel" = "homebrew" ]; }; then
              echo "::error::No passing 'qualify Homebrew formula' job found in CLI Binaries for $TAG ($TAG_SHA)"
              exit 1
            fi
          fi
          echo "qualified=$hb_qualified" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: update Homebrew tap
    needs: qualify
    environment: release-downstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: |
      github.repository == 'KitsuneKode/sweep' &&
      github.ref == 'refs/heads/main' &&
      needs.qualify.result == 'success' &&
      needs.qualify.outputs.qualified == 'true' &&
      needs.qualify.outputs.prerelease != 'true' &&
      needs.qualify.outputs.homebrew_qualified == 'true' &&
      (github.event_name == 'workflow_run' || inputs.downstream == '' || inputs.downstream == 'all' || inputs.downstream == 'homebrew')
    steps:
      - name: Check for tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_GITHUB_TOKEN not set; skipping Homebrew formula bump"
          fi

      # Always render templates and scripts from canonical `main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.present == 'true'
        with:
          ref: main
          sparse-checkout: |
            apps/cli/scripts/render-packaging.ts
            packaging/homebrew/sweep.rb.tmpl
          sparse-checkout-cone-mode: false
          path: main-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.tap.outputs.present == 'true'
        with:
          bun-version: 1.4.2

      - name: Download release checksums
        if: steps.tap.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          mkdir -p dist-bin
          gh release download "v$VERSION" \
            --repo KitsuneKode/sweep \
            -p 'sweep-darwin-arm64.gz.sha256' \
            -p 'sweep-darwin-x64.gz.sha256' \
            -p 'sweep-linux-arm64.gz.sha256' \
            -p 'sweep-linux-x64.gz.sha256' \
            -D dist-bin

      - name: Render and push Homebrew tap formula
        if: steps.tap.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          version="$VERSION"
          # Bind git push authentication to the repo-scoped GH_TOKEN without echoing it.
          gh auth setup-git --hostname github.com
          gh repo clone KitsuneKode/homebrew-tap tap -- --depth 1
          bun run main-src/apps/cli/scripts/render-packaging.ts homebrew \
            --version "$version" \
            --dist-dir dist-bin \
            --template main-src/packaging/homebrew/sweep.rb.tmpl \
            --out tap/Formula/sweep.rb \
            --reject-downgrade
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sweep.rb
          if git diff --cached --quiet; then
            echo "formula already at $version"
          else
            git commit -m "sweep $version"
            git push origin HEAD
          fi

  update-scoop:
    name: update Scoop bucket
    needs: qualify
    environment: release-downstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: |
      github.repository == 'KitsuneKode/sweep' &&
      github.ref == 'refs/heads/main' &&
      needs.qualify.result == 'success' &&
      needs.qualify.outputs.qualified == 'true' &&
      needs.qualify.outputs.prerelease != 'true' &&
      (github.event_name == 'workflow_run' || inputs.downstream == '' || inputs.downstream == 'all' || inputs.downstream == 'scoop')
    steps:
      - name: Check for Scoop bucket token
        id: scoop
        env:
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -n "${SCOOP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SCOOP_BUCKET_TOKEN not set; skipping Scoop bucket update"
          fi

      # Always render templates and scripts from canonical `main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scoop.outputs.present == 'true'
        with:
          ref: main
          sparse-checkout: |
            apps/cli/scripts/render-packaging.ts
            packaging/scoop/sweep.json
          sparse-checkout-cone-mode: false
          path: main-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scoop.outputs.present == 'true'
        with:
          bun-version: 1.4.2

      - name: Download Windows checksum
        if: steps.scoop.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          mkdir -p dist-bin
          gh release download "v$VERSION" \
            --repo KitsuneKode/sweep \
            -p 'sweep-win-x64.exe.sha256' \
            -D dist-bin

      - name: Render and push Scoop bucket manifest
        if: steps.scoop.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          version="$VERSION"
          # Bind git push authentication to the repo-scoped GH_TOKEN without echoing it.
          gh auth setup-git --hostname github.com
          gh repo clone KitsuneKode/scoop-bucket scoop -- --depth 1
          mkdir -p scoop/bucket
          bun run main-src/apps/cli/scripts/render-packaging.ts scoop \
            --version "$version" \
            --dist-dir dist-bin \
            --template main-src/packaging/scoop/sweep.json \
            --out scoop/bucket/sweep.json \
            --reject-downgrade
          cd scoop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/sweep.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already at $version"
          else
            git commit -m "sweep $version"
            git push origin HEAD
          fi
