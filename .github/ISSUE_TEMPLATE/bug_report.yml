name: Bug report
description: Something sweep did, or failed to do
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sweep version
      description: Output of `sweep --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and terminal
      placeholder: "Linux, kitty 0.35"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [js, rust, auto, not sure]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A directory layout and command is ideal. Please do not paste paths you consider private.
  - type: checkboxes
    id: safety
    attributes:
      label: Data loss
      options:
        - label: Files were deleted that should not have been (please say so above, this is treated as urgent)
