version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v2 requires Changesets CLI v3; the repo is on CLI v2. Move both together.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 0.x: a minor release is a breaking one. 0.8 breaks a UI review test and
      # logs native clipboard errors. Upgrade on purpose, not in a weekly group.
      - dependency-name: "@opentui/*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
